name: Deploy — Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # Never cancel in-flight prod deploys

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  # ── Tag release ───────────────────────────────────────────────────────────
  create-release:
    name: Create Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from date + short SHA
        id: version
        run: |
          VERSION="$(date -u '+%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"

  # ── Build production images ───────────────────────────────────────────────
  build-push:
    name: Build & Push Production Images
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jobaimer-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend (production)
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          build-args: |
            BUILD_VERSION=${{ needs.create-release.outputs.version }}
          tags: |
            ${{ env.ECR_REGISTRY }}/jobaimer-api:${{ needs.create-release.outputs.version }}
            ${{ env.ECR_REGISTRY }}/jobaimer-api:prod-latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/jobaimer-api:prod-latest
          cache-to: type=inline
          platforms: linux/amd64

      - name: Build & push agent (production)
        uses: docker/build-push-action@v5
        with:
          context: agent
          push: true
          build-args: |
            BUILD_VERSION=${{ needs.create-release.outputs.version }}
          tags: |
            ${{ env.ECR_REGISTRY }}/jobaimer-agent:${{ needs.create-release.outputs.version }}
            ${{ env.ECR_REGISTRY }}/jobaimer-agent:prod-latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/jobaimer-agent:prod-latest
          cache-to: type=inline
          platforms: linux/amd64

  # ── DB migrations ─────────────────────────────────────────────────────────
  migrate:
    name: Run DB Migrations
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jobaimer-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch DB URL from SSM
        id: ssm
        run: |
          DB_URL=$(aws ssm get-parameter \
            --name "/jobaimer/prod/supabase_db_url" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)
          echo "::add-mask::$DB_URL"
          echo "db_url=$DB_URL" >> "$GITHUB_OUTPUT"

      - name: Run Alembic migrations
        env:
          SUPABASE_DB_URL: ${{ steps.ssm.outputs.db_url }}
        run: |
          pip install alembic asyncpg --quiet
          cd backend
          # Dry run first
          alembic check
          # Apply
          alembic upgrade head
          echo "Migrations applied ✅"

  # ── Canary deploy — 10% ───────────────────────────────────────────────────
  deploy-canary:
    name: Canary Deploy (10%)
    needs: [create-release, build-push, migrate]
    runs-on: ubuntu-latest
    outputs:
      previous_image: ${{ steps.get-current.outputs.image }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jobaimer-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current Lambda image (for rollback)
        id: get-current
        run: |
          CURRENT=$(aws lambda get-function \
            --function-name jobaimer-api-prod \
            --query "Code.ImageUri" \
            --output text)
          echo "image=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current image: $CURRENT"

      - name: Deploy canary alias (10% traffic)
        run: |
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/jobaimer-api:${{ needs.create-release.outputs.version }}"

          # Update $LATEST
          aws lambda update-function-code \
            --function-name jobaimer-api-prod \
            --image-uri "$NEW_IMAGE"
          aws lambda wait function-updated --function-name jobaimer-api-prod

          # Publish new version
          NEW_VERSION=$(aws lambda publish-version \
            --function-name jobaimer-api-prod \
            --description "v${{ needs.create-release.outputs.version }}" \
            --query Version --output text)
          echo "New Lambda version: $NEW_VERSION"

          # Get current stable version from prod alias
          STABLE_VERSION=$(aws lambda get-alias \
            --function-name jobaimer-api-prod \
            --name prod \
            --query "RoutingConfig.AdditionalVersionWeights" \
            --output text 2>/dev/null || echo "1")

          # Update prod alias: 90% stable, 10% new
          aws lambda update-alias \
            --function-name jobaimer-api-prod \
            --name prod \
            --function-version "$NEW_VERSION" \
            --routing-config "AdditionalVersionWeights={$NEW_VERSION=0.1}" 2>/dev/null || \
          aws lambda create-alias \
            --function-name jobaimer-api-prod \
            --name prod \
            --function-version "$NEW_VERSION"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_ENV"

  # ── Canary health check ───────────────────────────────────────────────────
  canary-health-check:
    name: Canary Health Check (5 min)
    needs: [deploy-canary, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jobaimer-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Monitor canary for 5 minutes
        run: |
          API_URL="${{ secrets.PROD_API_BASE_URL }}"
          echo "Monitoring canary for 5 minutes..."
          
          ERRORS=0
          CHECKS=0
          END_TIME=$(($(date +%s) + 300))  # 5 minutes
          
          while [ $(date +%s) -lt $END_TIME ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${API_URL}/health" || echo "000")
            CHECKS=$((CHECKS + 1))
            
            if [ "$STATUS" != "200" ]; then
              ERRORS=$((ERRORS + 1))
              echo "⚠️  Check $CHECKS: HTTP $STATUS"
            else
              echo "✅ Check $CHECKS: HTTP $STATUS"
            fi
            
            # Fail fast if >5 consecutive errors
            if [ $ERRORS -ge 5 ]; then
              echo "❌ 5+ consecutive errors — triggering rollback"
              exit 1
            fi
            
            sleep 30
          done
          
          ERROR_RATE=$(echo "scale=2; $ERRORS * 100 / $CHECKS" | bc)
          echo "Canary complete: $ERRORS/$CHECKS errors ($ERROR_RATE%)"
          
          if [ "$ERRORS" -gt "2" ]; then
            echo "Error rate too high ($ERROR_RATE%) — triggering rollback"
            exit 1
          fi
          
          echo "Canary healthy ✅ ($ERROR_RATE% error rate)"

      - name: Check CloudWatch error metrics
        run: |
          # Check Lambda error rate over last 5 min
          ERRORS=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Lambda \
            --metric-name Errors \
            --dimensions Name=FunctionName,Value=jobaimer-api-prod \
            --start-time "$(date -u -d '5 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')" \
            --end-time "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --period 300 \
            --statistics Sum \
            --query "Datapoints[0].Sum" \
            --output text 2>/dev/null || echo "0")
          
          echo "Lambda errors in last 5min: $ERRORS"
          if (( $(echo "$ERRORS > 10" | bc -l) )); then
            echo "Too many Lambda errors ($ERRORS) — triggering rollback"
            exit 1
          fi

  # ── Rollback if canary fails ──────────────────────────────────────────────
  rollback:
    name: Rollback Canary
    needs: [canary-health-check, deploy-canary]
    runs-on: ubuntu-latest
    if: failure() && needs.canary-health-check.result == 'failure'
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jobaimer-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback Lambda to previous image
        run: |
          PREVIOUS="${{ needs.deploy-canary.outputs.previous_image }}"
          echo "Rolling back to: $PREVIOUS"
          aws lambda update-function-code \
            --function-name jobaimer-api-prod \
            --image-uri "$PREVIOUS"
          aws lambda wait function-updated --function-name jobaimer-api-prod
          echo "Rollback complete ✅"

      - name: Notify rollback
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "🚨 *JobAimer prod rollback triggered* — canary failed for v${{ needs.create-release.outputs.version }}",
              "channel": "#deployments"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Full 100% rollout ─────────────────────────────────────────────────────
  deploy-full:
    name: Full Rollout (100%)
    needs: [create-release, canary-health-check, deploy-canary]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jobaimer-github-actions-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Shift prod alias to 100% new version
        run: |
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/jobaimer-api:${{ needs.create-release.outputs.version }}"
          
          # Get new version number
          NEW_VERSION=$(aws lambda list-versions-by-function \
            --function-name jobaimer-api-prod \
            --query "Versions[-1].Version" \
            --output text)
          
          # Update alias to 100% new version (remove canary split)
          aws lambda update-alias \
            --function-name jobaimer-api-prod \
            --name prod \
            --function-version "$NEW_VERSION" \
            --routing-config "AdditionalVersionWeights={}"
          
          echo "Production fully rolled out to v${{ needs.create-release.outputs.version }} ✅"

      - name: Deploy agent (ECS rolling update)
        run: |
          AGENT_TAG="${{ needs.create-release.outputs.version }}"
          
          # Update task definition with new image
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition jobaimer-agent-prod \
            --query "taskDefinition" \
            --output json)
          
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "${{ env.ECR_REGISTRY }}/jobaimer-agent:$AGENT_TAG" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)')
          
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          
          aws ecs update-service \
            --cluster jobaimer-prod \
            --service jobaimer-agent-prod \
            --task-definition "$NEW_ARN" \
            --deployment-configuration "maximumPercent=150,minimumHealthyPercent=100"
          
          echo "Agent ECS update triggered ✅"

      - name: Build & deploy frontend (production)
        run: |
          npm install -g pnpm@9
          cd frontend
          pnpm install --frozen-lockfile
          VITE_API_BASE_URL="${{ secrets.PROD_API_BASE_URL }}" \
          VITE_SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
          VITE_SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}" \
          VITE_STRIPE_PUBLISHABLE_KEY="${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY }}" \
          pnpm build
          
          # Admin frontend
          cd ../frontend/admin
          pnpm install --frozen-lockfile
          VITE_ADMIN_API_BASE_URL="${{ secrets.PROD_ADMIN_API_BASE_URL }}" \
          VITE_SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}" \
          VITE_ADMIN_SUPABASE_ANON_KEY="${{ secrets.PROD_ADMIN_SUPABASE_ANON_KEY }}" \
          pnpm build

      - name: Deploy frontend to Cloudflare Pages (prod)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: jobaimer-prod
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy admin to Cloudflare Pages (prod)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: jobaimer-admin-prod
          directory: frontend/admin/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Final smoke test
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_API_BASE_URL }}/health")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Final smoke test failed — HTTP $STATUS"
            exit 1
          fi
          echo "✅ Production deployment complete — v${{ needs.create-release.outputs.version }}"

      - name: Tag release in Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.create-release.outputs.version }}" -m "Production release"
          git push origin "v${{ needs.create-release.outputs.version }}"

      - name: Notify success
        uses: slackapi/slack-github-action@v1.27.0
        if: always()
        with:
          payload: |
            {
              "text": "✅ *JobAimer v${{ needs.create-release.outputs.version }}* deployed to production",
              "channel": "#deployments"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
