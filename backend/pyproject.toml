[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobaimer-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "mangum==0.19.0",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "anthropic==0.34.2",
    "stripe==10.12.0",
    "boto3==1.35.20",
    "python-multipart==0.0.12",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "httpx==0.27.2",
    "sentry-sdk[fastapi]==2.14.0",
    "resend==2.4.0",
    "phonenumbers==8.13.45",
    "pdfminer.six==20231228",
    "python-docx==1.1.2",
    "reportlab==4.2.2",
    "rapidfuzz==3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3", "pytest-asyncio==0.24.0", "pytest-cov==5.0.0",
    "httpx==0.27.2", "factory-boy==3.3.1", "faker==28.4.1",
    "ruff==0.6.9", "mypy==1.11.2", "black==24.8.0",
    "bandit==1.7.10", "pip-audit==2.7.3",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E","F","I","N","W","UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=xml --cov-fail-under=80"
