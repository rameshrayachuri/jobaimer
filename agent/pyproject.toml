[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jobaimer-agent"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "temporalio==1.7.1",
    "playwright==1.44.0",
    "playwright-stealth==1.0.6",
    "anthropic==0.34.2",
    "boto3==1.35.20",
    "supabase==2.9.1",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "httpx==0.27.2",
    "rapidfuzz==3.10.0",
    "pdfminer.six==20231228",
    "reportlab==4.2.2",
    "python-docx==1.1.2",
    "stripe==10.12.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
